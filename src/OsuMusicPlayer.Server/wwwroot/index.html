<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu! music player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #11131a; color: #e6e8ef; }
  header { position: sticky; top: 0; background: #191c25; border-bottom: 1px solid #292d3a; padding: 10px 14px; display: flex; gap: 8px; align-items: center; z-index: 2; }
  header input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #292d3a; background: #11131a; color: inherit; font-size: 16px; }
  header select { padding: 10px; border-radius: 8px; border: 1px solid #292d3a; background: #11131a; color: inherit; }
  main { padding: 8px 8px 160px; }
  .track { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .track:active { background: #1c2029; }
  .track img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; background: #292d3a; }
  .track .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .sub { font-size: 12px; color: #aeb4c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .meta { font-size: 11px; color: #737a8d; }
  .actions { display: flex; gap: 6px; }
  button { border: 1px solid #292d3a; background: #1c2029; color: inherit; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button.primary { background: #2f6fed; border-color: #2f6fed; }
  button.fav { color: #ff66aa; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #191c25; border-top: 1px solid #292d3a; padding: 10px 14px; }
  footer .now { display: flex; gap: 10px; align-items: center; }
  footer img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #292d3a; }
  footer .info { flex: 1; min-width: 0; }
  footer .controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  footer progress { width: 100%; height: 6px; margin-top: 6px; accent-color: #2f6fed; }
  footer input[type=range] { flex: 1; }
  .mode { font-size: 12px; color: #aeb4c4; }
  #status { font-size: 12px; color: #737a8d; padding: 4px 14px; }
  header { flex-wrap: wrap; }
  header input { min-width: 0; }
  .library { width: 100%; display: flex; align-items: center; gap: 8px; }
  .library select { flex: 1; min-width: 0; }
  .track > div { min-width: 0; }
  button, select { min-height: 44px; }
  :focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  #status { color: #aeb4c4; }
  .pagination { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
  @media (max-width: 420px) { .track { grid-template-columns: 40px minmax(0, 1fr); } .track img { width: 40px; height: 40px; } .actions { grid-column: 2; } }
</style>
</head>
<body>
<header>
  <input id="q" type="search" aria-label="Search tracks in this view" placeholder="Search title, artist, mapper…" autocomplete="off">
  <select id="mode" title="Where to play">
    <option value="pc">Play on PC</option>
    <option value="here">Play here</option>
  </select>
  <div class="library">
    <label for="view">Library</label>
    <select id="view"><option value="all">All tracks</option><option value="favourites">Favourites</option></select>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>
<div id="status" role="status" aria-live="polite"></div>
<main id="list"></main>
<footer>
  <div class="now">
    <img id="nowImg" alt="">
    <div class="info">
      <div id="nowTitle" class="title">Nothing playing</div>
      <div id="nowSub" class="sub"></div>
      <progress id="nowProgress" value="0" max="1"></progress>
    </div>
  </div>
  <div class="controls">
    <button id="prev">⏮</button>
    <button id="toggle" class="primary">⏯</button>
    <button id="next">⏭</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" title="PC volume">
    <span id="nowMode" class="mode"></span>
  </div>
  <audio id="local" controls style="width:100%; margin-top:8px; display:none"></audio>
</footer>
<script>
(() => {
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const q = document.getElementById('q');
  const mode = document.getElementById('mode');
  const local = document.getElementById('local');
  const view = document.getElementById('view');
  let tracks = [];
  let localTracks = [];
  let localIndex = -1;
  let offset = 0;
  let requestVersion = 0;
  const pageSize = 100;

  const updateInsets = () => {
    const footerHeight = document.querySelector('footer').getBoundingClientRect().height + 16;
    list.style.paddingBottom = footerHeight + 'px';
    document.documentElement.style.scrollPaddingBottom = footerHeight + 'px';
    document.documentElement.style.scrollPaddingTop = document.querySelector('header').getBoundingClientRect().height + 8 + 'px';
  };
  const layoutObserver = new ResizeObserver(updateInsets);
  layoutObserver.observe(document.querySelector('footer'));
  layoutObserver.observe(document.querySelector('header'));
  updateInsets();

  const api = (path, options) => fetch(path, options).then(r => { if (!r.ok) throw new Error(r.status); return r.headers.get('content-type')?.includes('json') ? r.json() : null; });
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  async function refreshViews() {
    const playlists = await api('/api/playlists');
    const selected = view.value;
    while (view.options.length > 2) view.remove(2);
    for (const playlist of playlists) {
      const option = document.createElement('option');
      option.value = playlist.id;
      option.textContent = playlist.name + (playlist.isSmart ? ' (smart)' : '') + ' · ' + playlist.trackIds.length;
      view.appendChild(option);
    }
    view.value = [...view.options].some(option => option.value === selected) ? selected : 'all';
  }

  async function load() {
    const version = ++requestVersion;
    status.textContent = 'Loading tracks…';
    const params = new URLSearchParams({ limit: pageSize, offset, q: q.value });
    if (view.value === 'favourites') params.set('favourites', 'true');
    else if (view.value !== 'all') params.set('playlist', view.value);
    let data;
    try {
      data = await api('/api/tracks?' + params);
    } catch (error) {
      if (version === requestVersion) { status.textContent = 'Could not load this view. Try Refresh.'; list.innerHTML = ''; }
      return;
    }
    if (version !== requestVersion) return;
    if (data.total > 0 && offset >= data.total) { offset = 0; return load(); }
    tracks = data.items;
    status.textContent = data.total === 0 ? 'No tracks in this view match your search.' : data.total.toLocaleString() + ' tracks · showing ' + (offset + 1) + '–' + (offset + tracks.length);
    list.innerHTML = '';
    for (const [i, t] of tracks.entries()) {
      const row = document.createElement('div');
      row.className = 'track';
      row.innerHTML = `<img loading="lazy" ${t.hasBackground ? `src="/api/tracks/${t.id}/background"` : ''} alt="">
        <div><div class="title"></div><div class="sub"></div><div class="meta">${t.bpm.toFixed(0)} BPM · ${fmt(t.lengthSeconds)}</div></div>
        <div class="actions"><button class="fav" title="Favourite">${t.isFavourite ? '♥' : '♡'}</button><button title="Queue on PC">＋</button><button class="primary" title="Play">▶</button></div>`;
      row.querySelector('.title').textContent = t.title;
      row.querySelector('.sub').textContent = t.artist + ' · ' + t.creator;
      const [fav, queue, play] = row.querySelectorAll('button');
      fav.setAttribute('aria-label', 'Favourite ' + t.title);
      fav.setAttribute('aria-pressed', t.isFavourite);
      queue.setAttribute('aria-label', 'Queue ' + t.title + ' on PC');
      play.setAttribute('aria-label', 'Play ' + t.title);
      fav.onclick = async () => {
        fav.disabled = true;
        try {
          await api('/api/favourite/' + t.id, { method: 'POST' });
          await load();
        } catch { status.textContent = 'Could not update favourite. Try again.'; }
        finally { fav.disabled = false; }
      };
      queue.onclick = () => api('/api/queue/' + t.id, { method: 'POST' });
      play.onclick = () => { if (mode.value === 'here') { localTracks = tracks.slice(); playHere(i); } else api('/api/play/' + t.id, { method: 'POST' }); };
      list.appendChild(row);
    }
    if (data.total > pageSize) {
      const pagination = document.createElement('div');
      pagination.className = 'pagination';
      for (const [label, delta, disabled] of [['Previous page', -pageSize, offset === 0], ['Next page', pageSize, offset + tracks.length >= data.total]]) {
        const button = document.createElement('button');
        button.textContent = label;
        button.disabled = disabled;
        button.onclick = () => { offset += delta; load(); };
        pagination.appendChild(button);
      }
      list.appendChild(pagination);
    }
  }

  function playHere(index) {
    localIndex = index;
    const t = localTracks[index];
    local.style.display = 'block';
    local.src = '/api/tracks/' + t.id + '/audio';
    local.play().catch(() => {});
    document.getElementById('nowTitle').textContent = t.title;
    document.getElementById('nowSub').textContent = t.artist + ' · playing on this device';
    const img = document.getElementById('nowImg');
    if (t.hasBackground) img.src = '/api/tracks/' + t.id + '/background';
    else img.removeAttribute('src');
  }
  local.onended = () => { if (localIndex >= 0 && localIndex + 1 < localTracks.length) playHere(localIndex + 1); };

  async function refreshState() {
    if (mode.value === 'here') return;
    try {
      const s = await api('/api/state');
      const img = document.getElementById('nowImg');
      if (s.current) {
        document.getElementById('nowTitle').textContent = s.current.title;
        document.getElementById('nowSub').textContent = s.current.artist + ' · ' + fmt(s.positionSeconds) + ' / ' + fmt(s.durationSeconds);
        img.src = s.current.hasBackground ? '/api/tracks/' + s.current.id + '/background' : '';
      } else {
        document.getElementById('nowTitle').textContent = 'Nothing playing';
        document.getElementById('nowSub').textContent = '';
        img.removeAttribute('src');
      }
      document.getElementById('nowProgress').value = s.durationSeconds > 0 ? s.positionSeconds / s.durationSeconds : 0;
      document.getElementById('toggle').textContent = s.isPlaying ? '⏸' : '▶';
      document.getElementById('nowMode').textContent = [s.mod !== 'None' ? s.mod : '', s.shuffle ? 'shuffle' : '', s.repeat !== 'Off' ? 'repeat ' + s.repeat.toLowerCase() : ''].filter(Boolean).join(' · ');
      if (document.activeElement !== document.getElementById('vol')) document.getElementById('vol').value = s.volume;
    } catch { document.getElementById('nowSub').textContent = 'Server unreachable'; }
  }

  document.getElementById('prev').onclick = () => api('/api/previous', { method: 'POST' });
  document.getElementById('next').onclick = () => api('/api/next', { method: 'POST' });
  document.getElementById('toggle').onclick = () => mode.value === 'here' ? (local.paused ? local.play() : local.pause()) : api('/api/toggle', { method: 'POST' });
  document.getElementById('vol').oninput = e => api('/api/volume?value=' + e.target.value, { method: 'POST' });
  document.getElementById('nowProgress').onclick = e => { const r = e.target.getBoundingClientRect(); const ratio = (e.clientX - r.left) / r.width; api('/api/state').then(s => api('/api/seek?seconds=' + (ratio * s.durationSeconds), { method: 'POST' })); };
  let timer; q.oninput = () => { ++requestVersion; clearTimeout(timer); offset = 0; timer = setTimeout(load, 250); };
  view.onchange = () => { clearTimeout(timer); offset = 0; load(); };
  document.getElementById('refresh').onclick = async () => {
    try { await refreshViews(); await load(); }
    catch { status.textContent = 'Could not refresh library. Try again.'; }
  };
  mode.onchange = () => { if (mode.value === 'pc') local.pause(); };
  refreshViews().then(load).catch(() => { status.textContent = 'Could not load library. Try Refresh.'; });
  refreshState(); setInterval(refreshState, 2000);
})();
</script>
</body>
</html>
