<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>osu! music player overlay</title>
<style>
  /* Add this page as an OBS "Browser" source (e.g. 600x120). The background is transparent. */
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #card { display: flex; align-items: center; gap: 14px; width: 600px; height: 110px; padding: 10px 14px; box-sizing: border-box;
          background: rgba(17, 19, 26, 0.82); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 30px rgba(0,0,0,0.4);
          opacity: 0; transition: opacity .6s ease; }
  #card.visible { opacity: 1; }
  #bg { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: #292d3a; }
  #info { flex: 1; min-width: 0; }
  #title { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #artist { font-size: 15px; color: #cfd4e2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meta { font-size: 12px; color: #9aa1b4; margin-top: 4px; }
  #bar { height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff66aa, #2f6fed); transition: width 1s linear; }
</style>
</head>
<body>
<div id="card">
  <img id="bg" alt="">
  <div id="info">
    <div id="title"></div>
    <div id="artist"></div>
    <div id="meta"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
</div>
<script>
(() => {
  const card = document.getElementById('card');
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let lastId = null;
  async function tick() {
    try {
      const s = await (await fetch('/api/state')).json();
      if (!s.current) { card.classList.remove('visible'); lastId = null; return; }
      if (s.current.id !== lastId) {
        lastId = s.current.id;
        document.getElementById('title').textContent = s.current.title;
        document.getElementById('artist').textContent = s.current.artist;
        const bg = document.getElementById('bg');
        if (s.current.hasBackground) bg.src = '/api/tracks/' + s.current.id + '/background?t=' + Date.now(); else bg.removeAttribute('src');
      }
      document.getElementById('meta').textContent = (s.isPlaying ? '▶ ' : '⏸ ') + fmt(s.positionSeconds) + ' / ' + fmt(s.durationSeconds) + '  ·  mapped by ' + s.current.creator + (s.mod !== 'None' ? '  ·  ' + s.mod : '');
      document.getElementById('fill').style.width = (s.durationSeconds > 0 ? 100 * s.positionSeconds / s.durationSeconds : 0) + '%';
      card.classList.add('visible');
    } catch { card.classList.remove('visible'); }
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
